<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #ffffff;
}
.left-bar {
  width: 8pt;
  background: #8B2332;
}
.main {
  flex: 1;
  padding: 25pt 35pt 40pt 35pt;
  display: flex;
  flex-direction: column;
}
.header {
  margin-bottom: 15pt;
}
h1 {
  color: #8B2332;
  font-size: 26pt;
  margin: 0 0 5pt 0;
  font-weight: bold;
}
.subtitle {
  color: #666666;
  font-size: 11pt;
  margin: 0;
}
.content-area {
  display: flex;
  flex: 1;
  gap: 25pt;
}
.info-section {
  flex: 1;
}
.info-item {
  margin-bottom: 12pt;
}
.label {
  color: #8B2332;
  font-size: 10pt;
  margin: 0 0 2pt 0;
  font-weight: bold;
}
.value {
  color: #333333;
  font-size: 11pt;
  margin: 0;
  line-height: 1.3;
}
.photo-section {
  width: 240pt;
  display: flex;
  flex-direction: column;
}
.photo {
  flex: 1;
  background: #f0f0f0;
  border-radius: 4pt;
  overflow: hidden;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>
<div class="left-bar"></div>
<div class="main">
  <div class="header">
    <h1>TEAM OVERVIEW</h1>
    <p class="subtitle">仕事もプライベートもアメフトも全力で取り組む社会人組織</p>
  </div>
  <div class="content-area">
    <div class="info-section">
      <div class="info-item">
        <p class="label">TEAM NAME</p>
        <p class="value">Club TRIAX 調布</p>
      </div>
      <div class="info-item">
        <p class="label">MEMBERS</p>
        <p class="value">63名（DB:12 / DL:11 / WR:9 / RB:8 / OL:8 / LB:6 / QB:5 / TE:3 / P:1）</p>
      </div>
      <div class="info-item">
        <p class="label">PRACTICE</p>
        <p class="value">毎週土曜日午前（週1回）+ Zoomミーティング</p>
      </div>
      <div class="info-item">
        <p class="label">LOCATION</p>
        <p class="value">文京区本郷三丁目駅近く / 調布市三菱養和グラウンド（人工芝）</p>
      </div>
      <div class="info-item">
        <p class="label">ANNUAL FEE</p>
        <p class="value">新人: 3万円 / 継続: 7.5万円（2026年はさらなる減額を目標）</p>
      </div>
    </div>
    <div class="photo-section">
      <div class="photo"><img src="../assets/images/DSC05730.jpg"></div>
    </div>
  </div>
</div>
</body>
</html>
