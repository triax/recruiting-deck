<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #ffffff;
}
.left-bar {
  width: 6pt;
  background: #8B2332;
}
.main {
  flex: 1;
  padding: 20pt 30pt 45pt 30pt;
  display: flex;
  flex-direction: column;
}
.header {
  margin-bottom: 12pt;
}
h1 {
  color: #8B2332;
  font-size: 22pt;
  margin: 0 0 4pt 0;
  font-weight: bold;
}
.subtitle {
  color: #666666;
  font-size: 10pt;
  margin: 0;
}
.content-area {
  display: flex;
  flex: 1;
  gap: 20pt;
}
.stats-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10pt;
}
.year-card {
  background: #f8f8f8;
  border-radius: 6pt;
  padding: 12pt;
  border-left: 3pt solid #8B2332;
}
.year-label {
  color: #8B2332;
  font-size: 10pt;
  margin: 0 0 4pt 0;
  font-weight: bold;
}
.year-record {
  color: #333333;
  font-size: 20pt;
  margin: 0 0 2pt 0;
  font-weight: bold;
}
.year-note {
  color: #666666;
  font-size: 9pt;
  margin: 0;
}
.message-box {
  border-left: 3pt solid #D4AF37;
  padding: 10pt 12pt;
}
.message-box p {
  color: #333333;
  font-size: 10pt;
  margin: 0;
  line-height: 1.4;
}
.photo-section {
  width: 240pt;
  display: flex;
  flex-direction: column;
}
.photo {
  height: 240pt;
  background: #f0f0f0;
  border-radius: 6pt;
  overflow: hidden;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>
<div class="left-bar"></div>
<div class="main">
  <div class="header">
    <h1>TRACK RECORD</h1>
    <p class="subtitle">Area昇格から僅か3年で上位チームとの差が着実に縮まってきている</p>
  </div>
  <div class="content-area">
    <div class="stats-section">
      <div class="year-card">
        <p class="year-label">2023 SEASON</p>
        <p class="year-record">3勝 3敗</p>
        <p class="year-note">X1 Area昇格初年度</p>
      </div>
      <div class="year-card">
        <p class="year-label">2024 SEASON</p>
        <p class="year-record">3勝 2敗</p>
        <p class="year-note">勝率向上 - 着実な成長</p>
      </div>
      <div class="message-box">
        <p>上位チームとの点差も年々縮小。2026年は優勝を十分に狙える位置にいます。</p>
      </div>
    </div>
    <div class="photo-section">
      <div class="photo"><img src="../assets/images/DSC07635.jpg"></div>
    </div>
  </div>
</div>
</body>
</html>
