<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
  overflow: hidden;
  background: #1a1a1a;
}
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.6);
}
.content {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40pt;
  box-sizing: border-box;
}
.message {
  color: #ffffff;
  font-size: 20pt;
  margin: 0 0 15pt 0;
  line-height: 1.6;
}
h1 {
  color: #D4AF37;
  font-size: 36pt;
  margin: 0 0 30pt 0;
  font-weight: bold;
}
.divider {
  width: 80pt;
  height: 3pt;
  background: #D4AF37;
  margin-bottom: 30pt;
}
.contact-box {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 8pt;
  padding: 20pt 40pt;
}
.contact-label {
  color: #D4AF37;
  font-size: 11pt;
  margin: 0 0 8pt 0;
  font-weight: bold;
  letter-spacing: 2pt;
}
.contact-info {
  color: #ffffff;
  font-size: 14pt;
  margin: 0;
}
.footer {
  position: absolute;
  bottom: 20pt;
  left: 0;
  right: 0;
  text-align: center;
}
.footer p {
  color: rgba(255, 255, 255, 0.6);
  font-size: 10pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="content">
  <p class="message">X1 Areaで変革を起こそうとしている<br>トライアックスで、一緒に戦いませんか？</p>
  <h1>JOIN US</h1>
  <div class="divider"></div>
  <div class="contact-box">
    <p class="contact-label">CONTACT</p>
    <p class="contact-info">Instagram: @club_triax</p>
  </div>
</div>
<div class="footer">
  <p>Club TRIAX 調布 | LIFE / WORK / PLAY</p>
</div>
</body>
</html>
