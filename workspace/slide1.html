<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
  overflow: hidden;
  background: #1a1a1a;
}
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.5);
}
.content {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40pt;
  box-sizing: border-box;
}
.accent-bar {
  width: 80pt;
  height: 4pt;
  background: #D4AF37;
  margin-bottom: 20pt;
}
h1 {
  color: #ffffff;
  font-size: 48pt;
  margin: 0 0 10pt 0;
  font-weight: bold;
  letter-spacing: 4pt;
}
h2 {
  color: #D4AF37;
  font-size: 24pt;
  margin: 0 0 30pt 0;
  font-weight: normal;
}
.tagline {
  color: #ffffff;
  font-size: 14pt;
  margin: 0;
  opacity: 0.9;
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="content">
  <div class="accent-bar"></div>
  <h1>CLUB TRIAX</h1>
  <h2>2026 RECRUITING</h2>
  <p class="tagline">LIFE / WORK / PLAY</p>
</div>
</body>
</html>
