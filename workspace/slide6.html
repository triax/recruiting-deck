<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
  overflow: hidden;
  background: #8B2332;
}
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(139, 35, 50, 0.7);
}
.content {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40pt;
  box-sizing: border-box;
}
.year-badge {
  background: #D4AF37;
  border-radius: 20pt;
  padding: 6pt 20pt;
  margin-bottom: 15pt;
}
.year-badge p {
  color: #1a1a1a;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  color: #ffffff;
  font-size: 38pt;
  margin: 0 0 8pt 0;
  font-weight: bold;
  letter-spacing: 3pt;
}
.goal-text {
  color: #D4AF37;
  font-size: 48pt;
  margin: 0 0 20pt 0;
  font-weight: bold;
}
.divider {
  width: 60pt;
  height: 3pt;
  background: #D4AF37;
  margin-bottom: 20pt;
}
.message {
  color: #ffffff;
  font-size: 13pt;
  margin: 0;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="content">
  <div class="year-badge"><p>2026 GOAL</p></div>
  <h1>X1 AREA</h1>
  <p class="goal-text">CHAMPION</p>
  <div class="divider"></div>
  <p class="message">Area昇格3年目。今こそ、頂点を掴む時。</p>
</div>
</body>
</html>
